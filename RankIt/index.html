<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RankIt</title>

  <link rel="stylesheet" href="css/style.css"
</head>
<body>
  <div class="app">

    <!-- MENU LATERAL -->
    <aside class="sidebar">

      <div class="logo">
        🏆 <span>RankIt</span>
      </div>

      <nav class="menu">

        <button class="menu-button active" id="btnInicio">
          🏠
          <span>Início</span>
        </button>

        <button class="menu-button" id="btnRankings">
          📋
          <span>Meus rankings</span>
        </button>

        <button class="menu-button" id="btnConfiguracoes">
          ⚙️
          <span>Configurações</span>
        </button>

      </nav>

      <div class="sidebar-footer">
        <p>Sua opinião</p>
        <p>importa.</p>
      </div>
    </aside>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="content">


      <section class="home">

        <div class="trophy">
          🏆
        </div>

        <h1>RankIt</h1>

        <p class="subtitle">
          Transforme suas preferências
          <br>
          em um ranking.
        </p>

        <button class="primary-button" id="btnCriarRanking">
          + Criar novo ranking
        </button>

        <!-- BENEFÍCIOS -->
        <div class="features">

          <div class="feature">
            <div class="feature-icon">🎮</div>
            <span>Escolha seus itens</span>
          </div>

          <div class="feature">
            <div class="feature-icon">⚔️</div>
            <span>Compare suas opções</spans>
          </div>

          <div class="feature">
            <div class="feature-icon">🏆</div>
            <span>Descubra seu ranking</span>
          </div>

        </div>
      
      </section>
    
    </main>
  
  </div>

  <script src="js/main.js"></script>

</body>
</html>
