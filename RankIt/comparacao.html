<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comparação - RankIt</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="app">

        <!-- MENU LATERAL -->
        <aside class="sidebar">

            <div class="logo">
                🏆 <span>RankIt</span>
            </div>

            <nav class="menu">

                <button class="menu-button"
                    onclick="window.location.href='index.html'">
                    🏠
                    <span>Início</span>
                </button>

                <button class="menu-button">
                    📋
                    <span>Meus Rankings</span>
                </button>

                <button class="menu-button">
                    ⚙️
                    <span>Configurações</span>
                </button>

            </nav>

            <div class="sidebar-footer">
                <p>Sua opinião</p>
                <p>importa.</p>
            </div>

        </aside>


        <!-- CONTEÚDO -->
        <main class="content">

            <section class="comparison-page">

                <p class="comparison-label">
                    COMPARAÇÃO 1 DE 6
                </p>

                <h1>Qual você prefere?</h1>

                <p class="comparison-description">
                    Escolha uma das opções abaixo.
                </p>


                <!-- OPÇÕES -->

                <div class="comparison-options">


                    <!-- OPÇÃO 1 -->

                    <div class="comparison-card">

                        <div class="comparison-image">
                            🎮
                        </div>

                        <h2>Stardew Valley</h2>

                        <button class="choose-button">
                            Escolher
                        </button>

                    </div>


                    <!-- VS -->

                    <div class="versus">
                        VS
                    </div>


                    <!-- OPÇÃO 2 -->

                    <div class="comparison-card">

                        <div class="comparison-image">
                            🎮
                        </div>

                        <h2>Minecraft</h2>

                        <button class="choose-button">
                            Escolher
                        </button>

                    </div>

                </div>


                <!-- PROGRESSO -->

                <div class="progress-area">

                    <div class="progress-text">
                        1 de 6 comparações
                    </div>

                    <div class="progress-bar">

                        <div class="progress-fill"></div>

                    </div>

                </div>


                <!-- SAIR -->

                <button
                    class="secondary-button"
                    onclick="window.location.href='itens.html'">
                    ← Voltar para itens
                </button>

            </section>

        </main>

    </div>
	<script src="js/comparacao.js"></script>

</body>

</html>
